# pytest configuration for Playwright tests
[pytest]
minversion = 7.0
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --html=backend/tests/report.html
    --self-contained-html
testpaths = backend/tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    playwright: Mark test as a Playwright browser automation test
    api: Mark test as an API integration test
    slow: Mark test as slow running
    integration: Mark test as an integration test
    unit: Mark test as a unit test

# Timeout for tests (in seconds)
timeout = 30
timeout_method = thread

# Logging
log_cli = true
log_cli_level = INFO
log_file = backend/tests/pytest.log
log_file_level = DEBUG

